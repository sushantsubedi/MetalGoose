name: Build MetalGoose

on:
  push:
    branches: [main]
  workflow_dispatch:  # lets you trigger manually

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: List schemes
        run: xcodebuild -project MetalGoose.xcodeproj -list

      - name: Build
        run: |
          xcodebuild -project MetalGoose.xcodeproj \
            -scheme MetalGoose \
            -configuration Debug \
            -derivedDataPath build \
            build

